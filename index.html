<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>美股觀察</title>
<style>
:root{--bg:#07111f;--p:#0d1828;--p2:#112139;--line:#22324a;--txt:#f6fbff;--muted:#8ea1b9;--up:#ff4d75;--dn:#29d39a;--acc:#58d9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1024px;margin:auto;padding:16px 12px 48px}.top h1{margin:0;font-size:30px}.top p{margin:6px 0 10px;color:var(--muted);font-size:13px}.stamp{font-size:12px;color:var(--muted);margin-bottom:10px}
.tabs{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(7,17,31,.96);padding:8px 0 12px}
.tab{background:var(--p2);border:1px solid var(--line);border-radius:13px;color:var(--muted);padding:12px 6px;font-weight:800}.tab.on{color:#c9f6ff;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.page{display:none}.page.on{display:block}.title{font-size:23px;font-weight:900;margin:4px 0}.sub{font-size:13px;color:var(--muted);margin-bottom:13px;line-height:1.5}
.grid,.newsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.group,.news{background:var(--p);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gh{display:flex;justify-content:space-between;gap:8px;padding:13px 14px;background:var(--p2);border-bottom:1px solid var(--line)}.gh b{font-size:16px}.count{font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.07)}.row:last-child{border-bottom:0}
.t{font-weight:900;font-size:16px}.n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c{font-weight:900;font-size:17px;white-space:nowrap}.pos{color:var(--up)}.neg{color:var(--dn)}.na{color:#cbd6e2}
.heatgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}.heat{border:1px solid rgba(255,255,255,.12);border-radius:15px;overflow:hidden;color:#fff}.heat summary{list-style:none;cursor:pointer;min-height:145px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.heat summary::-webkit-details-marker{display:none}.heat[open]{grid-column:1/-1}.heat[open] summary{min-height:90px;border-bottom:1px solid rgba(255,255,255,.16)}
.hn{font-size:18px;font-weight:900}.hr{font-size:30px;font-weight:900;margin-top:8px}.hm{font-size:12px;opacity:.72;margin-top:7px}.up3{background:#ca3138}.up2{background:#a83339}.up1{background:#74383d}.dn1{background:#174f45}.dn2{background:#0d6550}.dn3{background:#0a7e5e}.flat{background:#3a4658}
.inner{background:var(--p);padding:4px 12px 8px}.ir{display:grid;grid-template-columns:28px minmax(0,1fr) 88px;gap:8px;align-items:center;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.08)}.ir:last-child{border-bottom:0}.rank{font-size:12px;color:var(--muted)}.ic{text-align:right;font-weight:900;white-space:nowrap}
.nh{display:flex;justify-content:space-between;gap:10px;padding:13px 14px;background:var(--p2);border-bottom:1px solid var(--line)}.badge{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;height:max-content}.good{color:var(--up);border:1px solid #ff4d7560;background:#ff4d751a}.bad{color:var(--dn);border:1px solid #29d39a60;background:#29d39a1a}.theme{color:#a9ebff;border:1px solid #58d9ff60;background:#58d9ff18}
.nb{padding:14px}.head{font-weight:900;font-size:16px;line-height:1.45}.desc{margin-top:8px;color:#dce7f3;font-size:14px;line-height:1.6}.src{display:inline-block;margin-top:10px;color:var(--acc);text-decoration:none;font-size:13px}
.empty{padding:24px;text-align:center;color:var(--muted);background:var(--p);border:1px solid var(--line);border-radius:14px}
@media(max-width:720px){.grid,.newsgrid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><h1>美股觀察</h1><p>依投資題材分組｜紅漲綠跌</p><div id="stamp" class="stamp">載入中…</div></div>
<nav class="tabs"><button class="tab on" data-p="stocks">族群漲跌</button><button class="tab" data-p="heat">市場熱力圖</button><button class="tab" data-p="news">市場新聞</button></nav>
<section id="stocks" class="page on"><div class="title">族群漲跌</div><div class="sub">個股依題材分類，顯示最新漲跌幅</div><div id="groups" class="grid"></div></section>
<section id="heat" class="page"><div class="title">市場熱力圖</div><div class="sub">族群漲跌幅＝族群內個股依市值加權；卡片大小固定。點擊族群可展開個股，依漲幅高到低排序</div><div id="heatgrid" class="heatgrid"></div></section>
<section id="news" class="page"><div class="title">市場新聞</div><div class="sub">自動掃描觀察清單近 36 小時的公司催化、利多、利空與重要題材</div><div id="newsgrid" class="newsgrid"></div></section>
</div>
<script>
const fmt=v=>v==null?"--":(v>0?"+":"")+v.toFixed(2)+"%";
const cls=v=>v==null?"na":v>=0?"pos":"neg";
const tone=v=>v==null?"flat":v>=3?"up3":v>=1?"up2":v>0.1?"up1":v<=-3?"dn3":v<=-1?"dn2":v<-0.1?"dn1":"flat";
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById(b.dataset.p).classList.add("on")});
async function load(){
  const [d,n]=await Promise.all([fetch("data.json?"+Date.now()).then(r=>r.json()),fetch("news.json?"+Date.now()).then(r=>r.json())]);
  document.getElementById("stamp").textContent="資料更新："+d.updatedAt;
  const g=document.getElementById("groups");
  d.groups.forEach(x=>{const s=document.createElement("section");s.className="group";s.innerHTML=`<div class="gh"><b>${x.name}</b><span class="count">${x.stocks.length} 檔</span></div>`+x.stocks.map(z=>`<div class="row"><div><div class="t">${z.ticker}</div><div class="n">${z.name}</div></div><div class="c ${cls(z.changePct)}">${fmt(z.changePct)}</div></div>`).join("");g.appendChild(s)});
  const h=document.getElementById("heatgrid");
  [...d.groups].sort((a,b)=>(b.returnPct??-999)-(a.returnPct??-999)).forEach(x=>{const q=document.createElement("details");q.className="heat "+tone(x.returnPct);const ss=[...x.stocks].sort((a,b)=>(b.changePct??-999)-(a.changePct??-999));q.innerHTML=`<summary><div class="hn">${x.name}</div><div class="hr">${fmt(x.returnPct)}</div><div class="hm">點擊查看個股｜漲幅高 → 低</div></summary><div class="inner">`+ss.map((z,i)=>`<div class="ir"><div class="rank">${i+1}</div><div><div class="t">${z.ticker}</div><div class="n">${z.name}</div></div><div class="ic ${cls(z.changePct)}">${fmt(z.changePct)}</div></div>`).join("")+"</div>";h.appendChild(q)});
  const ng=document.getElementById("newsgrid");
  if(!n.items.length){ng.innerHTML='<div class="empty">目前沒有符合條件的新催化消息</div>';return}
  n.items.forEach(x=>{const c=document.createElement("article");c.className="news";const b=x.tag==="利多"?"good":x.tag==="利空"?"bad":"theme";c.innerHTML=`<div class="nh"><div><div class="t">${x.ticker}</div><div class="n">${x.group}</div></div><span class="badge ${b}">${x.tag}</span></div><div class="nb"><div class="head">${x.title}</div>${x.summary?`<div class="desc">${x.summary}</div>`:""}${x.url?`<a class="src" target="_blank" href="${x.url}">來源 ↗</a>`:""}</div>`;ng.appendChild(c)});
}
load().catch(e=>{document.getElementById("stamp").textContent="資料載入失敗，請稍後重新整理"});
setInterval(()=>{
  document.getElementById("groups").innerHTML="";
  document.getElementById("heatgrid").innerHTML="";
  document.getElementById("newsgrid").innerHTML="";
  load().catch(()=>{});
},300000);
</script></body></html>
