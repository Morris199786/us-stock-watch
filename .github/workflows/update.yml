name: Update US Stock Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "updater.py"
      - "config.json"
      - "requirements.txt"
      - "index.html"
      - ".github/workflows/update.yml"
      - ".github/workflows/earnings.yml"

permissions:
  contents: write

concurrency:
  group: us-stock-watch-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

