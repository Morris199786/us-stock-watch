name: Update US Stock Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Decide whether this close-time run should execute
        id: gate
        shell: python
        run: |
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import os

          utc = datetime.now(timezone.utc)
          tw = utc.astimezone(ZoneInfo("Asia/Taipei"))
          ny = utc.astimezone(ZoneInfo("America/New_York"))

          ok = (tw.hour == 21) or (ny.hour == 16)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'yes' if ok else 'no'}\n")

      - if: steps.gate.outputs.run == 'yes'
        run: python updater.py

      - if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json news.json
          git diff --cached --quiet || git commit -m "Auto update market data"
          git push
