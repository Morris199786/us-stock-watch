        run: |
          printf '%s' "$PATCH_B64" | tr -d '[:space:]' | base64 -d > /tmp/install_fixes.py
          python -m py_compile /tmp/install_fixes.py
          python /tmp/install_fixes.py

      - name: Update fast data only
        env:
          SKIP_EARNINGS: "1"
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python updater.py

      - name: Commit generated data and integrated fixes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data.json /tmp/data.json
          cp news.json /tmp/news.json
          cp congress.json /tmp/congress.json
          cp updater.py /tmp/updater.py
          cp index.html /tmp/index.html
          cp config.json /tmp/config.json

          if [ -f focus.json ]; then cp focus.json /tmp/focus.json; fi
          if [ -f macro.json ]; then cp macro.json /tmp/macro.json; fi
          if [ -f push_state.json ]; then cp push_state.json /tmp/push_state.json; fi

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/data.json data.json
          cp /tmp/news.json news.json
          cp /tmp/congress.json congress.json
          cp /tmp/updater.py updater.py
          cp /tmp/index.html index.html
          cp /tmp/config.json config.json

          if [ -f /tmp/focus.json ]; then cp /tmp/focus.json focus.json; fi
          if [ -f /tmp/macro.json ]; then cp /tmp/macro.json macro.json; fi
          if [ -f /tmp/push_state.json ]; then cp /tmp/push_state.json push_state.json; fi

          git add data.json news.json congress.json updater.py index.html config.json
          if [ -f focus.json ]; then git add focus.json; fi
          if [ -f macro.json ]; then git add macro.json; fi
          if [ -f push_state.json ]; then git add push_state.json; fi

          if ! git diff --cached --quiet; then
            git commit -m "Install integrated macro and Congress fixes"
            git push origin main
          fi
