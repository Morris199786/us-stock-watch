name: Update US Stock Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "updater.py"
      - "config.json"
      - "requirements.txt"
      - "index.html"
      - ".github/workflows/update.yml"
      - ".github/workflows/earnings.yml"

permissions:
  contents: write

concurrency:
  group: us-stock-watch-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install integrated fixes
        run: |
          cat > /tmp/install_fixes.py <<'PY'
          from pathlib import Path
          import re

          updater_file = Path("updater.py")
          index_file = Path("index.html")

          s = updater_file.read_text(encoding="utf-8")

          # 1) Telegram sender + Forex Factory visible-page fallback
          if "def _send_telegram(" not in s:
              marker = "def refresh_macro_data():"
              if marker not in s:
                  raise RuntimeError("refresh_macro_data marker missing")

              helpers = r"""
          def _send_telegram(title, message, url=None):
              token = (os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
              chat_id = (os.environ.get("TELEGRAM_CHAT_ID") or "").strip()

              if not token or not chat_id:
                  return False, "missing_telegram_secrets"

              text = f"{title}\n{message}".strip()
              if url:
                  text += f"\n{url}"

              try:
                  payload = json.dumps({
                      "chat_id": chat_id,
                      "text": text[:3900],
                      "disable_web_page_preview": True,
                  }, ensure_ascii=False).encode("utf-8")

                  req = urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data=payload,
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "us-stock-watch/1.0",
                      },
                      method="POST",
                  )

                  with urllib.request.urlopen(req, timeout=12) as r:
                      ok = 200 <= getattr(r, "status", 200) < 300

                  return ok, "ok" if ok else "http_error"

              except Exception as e:
                  return False, type(e).__name__


          def _ff_clean_html_text(value):
              text = re.sub(r"<[^>]+>", " ", str(value or ""))
              text = re.sub(r"\s+", " ", text)
              return html_lib.unescape(text).strip()


          def _ff_web_calendar_today():
              try:
                  req = urllib.request.Request(
                      "https://www.forexfactory.com/calendar?day=today",
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Accept": "text/html,application/xhtml+xml",
                          "Accept-Language": "en-US,en;q=0.9",
                          "Referer": "https://www.forexfactory.com/calendar",
                      },
                  )

                  with urllib.request.urlopen(req, timeout=15) as r:
                      html_text = r.read().decode("utf-8", "ignore")

              except Exception:
                  return {}

              rows = re.findall(
                  r'(<tr[^>]*class="[^"]*calendar__row[^"]*"[^>]*>.*?</tr>)',
                  html_text,
                  flags=re.I | re.S,
              )

              out = {}

              for row in rows:
                  m = re.search(
                      r'class="[^"]*calendar__event[^"]*"[^>]*>(.*?)</td>',
                      row,
                      flags=re.I | re.S,
                  )

                  if not m:
                      continue

                  title = _ff_clean_html_text(m.group(1))
                  if not title:
                      continue

                  def cell(cls):
                      mm = re.search(
                          rf'class="[^"]*{re.escape(cls)}[^"]*"[^>]*>(.*?)</td>',
                          row,
                          flags=re.I | re.S,
                      )
                      return _ff_clean_html_text(mm.group(1)) if mm else ""

                  out[title.lower()] = {
                      "actual": cell("calendar__actual"),
                      "forecast": cell("calendar__forecast"),
                      "previous": cell("calendar__previous"),
                  }

              return out


          def _ff_apply_web_fallback(raw_rows, now_utc):
              need = False

              for row in raw_rows:
                  if str(
                      row.get("country")
                      or row.get("currency")
                      or ""
                  ).upper() != "USD":
                      continue

                  impact = str(row.get("impact") or "").strip().title()
                  if impact not in ("High", "Medium"):
                      continue

                  dt = _ff_dt(row)

                  if (
                      dt
                      and dt <= now_utc + timedelta(minutes=1)
                      and not str(row.get("actual") or "").strip()
                  ):
                      need = True
                      break

              if not need:
                  return raw_rows

              web = _ff_web_calendar_today()
              if not web:
                  return raw_rows

              for row in raw_rows:
                  title = str(row.get("title") or "").strip()
                  if not title:
                      continue

                  w = web.get(title.lower())

                  if not w:
                      wanted = re.sub(
                          r"[^a-z0-9]+",
                          " ",
                          title.lower()
                      ).strip()

                      for k, v in web.items():
                          if re.sub(
                              r"[^a-z0-9]+",
                              " ",
                              k
                          ).strip() == wanted:
                              w = v
                              break

                  if not w:
                      continue

                  if w.get("actual"):
                      row["actual"] = w["actual"]

                  if w.get("forecast"):
                      row["forecast"] = w["forecast"]

                  if w.get("previous"):
                      row["previous"] = w["previous"]

              return raw_rows


          """
              s = s.replace(marker, helpers + marker, 1)

          fallback_line = "    raw = _ff_apply_web_fallback(raw, now_utc)"
          if fallback_line not in s:
              anchor = "    raw += _ff_fetch(FF_NEXT_WEEK_JSON)"
              if anchor not in s:
                  raise RuntimeError("Forex Factory second fetch line missing")
              s = s.replace(anchor, anchor + "\n" + fallback_line, 1)

          # 2) Macro notifications -> Telegram ONLY
          s = s.replace(
              '_send_pushover(\n            "今日美國重要數據",',
              '_send_telegram(\n            "今日美國重要數據",',
              1
          )
          s = s.replace(
              '_send_pushover(\n            "美國數據公布",',
              '_send_telegram(\n            "美國數據公布",',
              1
          )

          # 3) Congress filer_id -> filer metadata
          if "filer_by_id = {" not in s:
              anchor = """    except Exception:
                  filers = previous.get("filers", []) if isinstance(previous, dict) else []

              items = []"""

              replacement = """    except Exception:
                  filers = previous.get("filers", []) if isinstance(previous, dict) else []

              filer_by_id = {
                  str(f.get("id") or "").strip(): f
                  for f in filers
                  if isinstance(f, dict) and str(f.get("id") or "").strip()
              }

              items = []"""

              if anchor not in s:
                  raise RuntimeError("Congress filer directory anchor missing")
              s = s.replace(anchor, replacement, 1)

          old_block = """        # Congress only; exclude executive-branch disclosure rows.
                  if (row.get("branch") or "").lower() not in ("", "congress"):
                      continue

                  traded = _parse_date(row.get("transaction_date"))
                  filed = _parse_date(row.get("filing_date"))
                  if not traded or traded < CONGRESS_START_DATE:
                      continue

                  member = (row.get("filer_name") or row.get("member") or "").strip()
                  ticker = (row.get("ticker") or "").strip().upper()
                  if not member:
                      continue

                  action, action_zh = _trade_action(row.get("transaction_type") or row.get("action"))
                  chamber = (row.get("chamber") or "").strip().lower()
                  chamber_zh = "參議院" if chamber == "senate" else "眾議院" if chamber == "house" else chamber"""

          new_block = """        filer_id = str(row.get("filer_id") or "").strip()
                  filer_meta = filer_by_id.get(filer_id, {})

                  row_branch = str(
                      row.get("branch")
                      or filer_meta.get("branch")
                      or "congress"
                  ).strip().lower()

                  if row_branch not in ("", "congress"):
                      continue

                  traded = _parse_date(row.get("transaction_date"))
                  filed = _parse_date(row.get("filing_date"))
                  if not traded or traded < CONGRESS_START_DATE:
                      continue

                  member = str(
                      row.get("filer_name")
                      or row.get("member")
                      or filer_meta.get("name")
                      or filer_meta.get("full_name")
                      or ""
                  ).strip()

                  ticker = (row.get("ticker") or "").strip().upper()

                  if not member:
                      continue

                  action, action_zh = _trade_action(
                      row.get("transaction_type")
                      or row.get("action")
                  )

                  chamber = str(
                      row.get("chamber")
                      or filer_meta.get("chamber")
                      or ""
                  ).strip().lower()

                  chamber_zh = (
                      "參議院"
                      if chamber == "senate"
                      else "眾議院"
                      if chamber == "house"
                      else chamber
                  )"""

          if old_block in s:
              s = s.replace(old_block, new_block, 1)

          s = s.replace(
              '"memberId": (row.get("filer_id") or "").strip(),',
              '"memberId": filer_id,',
              1
          )

          s = s.replace(
              '"party": row.get("party"),\n            "state": row.get("state"),',
              '"party": row.get("party") or filer_meta.get("party"),\n'
              '            "state": row.get("state") or filer_meta.get("state"),',
              1
          )

          must_have = (
              "def _send_telegram(",
              "_ff_apply_web_fallback(raw, now_utc)",
              '_send_telegram(\n            "今日美國重要數據",',
              '_send_telegram(\n            "美國數據公布",',
              "filer_by_id = {",
              "filer_meta = filer_by_id.get(filer_id, {})",
              'or filer_meta.get("name")',
              '"memberId": filer_id,',
              'row.get("party") or filer_meta.get("party")',
              'row.get("state") or filer_meta.get("state")',
          )

          for token in must_have:
              if token not in s:
                  raise RuntimeError("updater check failed: " + token)

          if '_send_pushover(\n            "今日美國重要數據",' in s:
              raise RuntimeError("Macro morning reminder still uses Pushover")

          if '_send_pushover(\n            "美國數據公布",' in s:
              raise RuntimeError("Macro result still uses Pushover")

          compile(s, "updater.py", "exec")
          updater_file.write_text(s, encoding="utf-8")

          # 4) Congress UI: default listed stocks / ETF, no N/A display
          h = index_file.read_text(encoding="utf-8")

          if 'id="assetFilter"' not in h:
              chamber_select = '<select id="chamberFilter"><option value="">House + Senate</option><option value="house">眾議院</option><option value="senate">參議院</option></select>'
              if chamber_select not in h:
                  raise RuntimeError("Congress chamber select missing")

              asset_select = '<select id="assetFilter"><option value="listed" selected>上市股票／ETF</option><option value="other">其他資產</option><option value="">全部資產</option></select>'
              h = h.replace(chamber_select, chamber_select + "\n    " + asset_select, 1)

          if "function congressAssetName(x)" not in h:
              marker = "function renderCongress(){"
              if marker not in h:
                  raise RuntimeError("renderCongress marker missing")

              helpers = r"""function congressAssetName(x){
           const ticker=String(x.ticker||"").trim().toUpperCase();
           if(ticker)return ticker;

           let asset=String(x.asset||"").replace(/\s+/g," ").trim();
           if(!asset)return "其他資產";

           const company=asset.match(/Company:\s*(.+?)(?:\s*\([^)]*\)|\s*Description:|$)/i);
           if(company&&company[1])return company[1].trim();

           asset=asset.replace(/\s*Description:.*$/i,"").trim();
           return asset||"其他資產";
          }

          function congressAssetSubLabel(x){
           const ticker=String(x.ticker||"").trim().toUpperCase();

           if(ticker){
             return String(x.asset||"").replace(/\s+/g," ").trim();
           }

           const asset=String(x.asset||"").replace(/\s+/g," ").trim();
           const desc=asset.match(/Description:\s*(.+)$/i);

           if(desc&&desc[1]){
             return desc[1].trim();
           }

           return String(x.assetType||"").trim()||"非上市資產";
          }

          """
              h = h.replace(marker, helpers + marker, 1)

          if "const assetMode=" not in h:
              anchor = ' const chamber=document.getElementById("chamberFilter")?.value||"";'
              if anchor not in h:
                  raise RuntimeError("Congress chamber variable missing")
              h = h.replace(
                  anchor,
                  anchor + '\n const assetMode=document.getElementById("assetFilter")?.value??"listed";',
                  1
              )

          if 'assetMode==="listed"' not in h:
              anchor = '   if(chamber && (x.chamber||"")!==chamber)return false;'
              if anchor not in h:
                  raise RuntimeError("Congress filter anchor missing")
              h = h.replace(
                  anchor,
                  anchor
                  + '\n   const hasTicker=!!String(x.ticker||"").trim();'
                  + '\n   if(assetMode==="listed" && !hasTicker)return false;'
                  + '\n   if(assetMode==="other" && hasTicker)return false;',
                  1
              )

          if 'const tickerLabel=x.ticker||"N/A";' in h:
              h = h.replace(
                  '   const tickerLabel=x.ticker||"N/A";',
                  '   const tickerLabel=congressAssetName(x);\n'
                  '   const assetSub=congressAssetSubLabel(x);',
                  1
              )

              old_row = '<div><div class="ticker">${tickerLabel}</div><div class="csmall">${x.asset||""}</div></div>'
              new_row = '<div><div class="ticker">${escapeHtml(tickerLabel)}</div><div class="csmall">${escapeHtml(assetSub)}</div></div>'

              if old_row not in h:
                  raise RuntimeError("Congress row marker missing")

              h = h.replace(old_row, new_row, 1)

          h = h.replace(
              '["actionFilter","chamberFilter"].forEach',
              '["actionFilter","chamberFilter","assetFilter"].forEach',
              1
          )

          old_clear = ' const a=document.getElementById("actionFilter"),c=document.getElementById("chamberFilter");if(a)a.value="";if(c)c.value="";'
          new_clear = ' const a=document.getElementById("actionFilter"),c=document.getElementById("chamberFilter"),af=document.getElementById("assetFilter");if(a)a.value="";if(c)c.value="";if(af)af.value="listed";'
          if old_clear in h:
              h = h.replace(old_clear, new_clear, 1)

          ui_must_have = (
              'id="assetFilter"',
              'option value="listed" selected',
              "function congressAssetName(x)",
              'const assetMode=document.getElementById("assetFilter")?.value??"listed";',
              'assetMode==="listed"',
              '["actionFilter","chamberFilter","assetFilter"]',
          )

          for token in ui_must_have:
              if token not in h:
                  raise RuntimeError("Congress UI check failed: " + token)

          if 'const tickerLabel=x.ticker||"N/A";' in h:
              raise RuntimeError("Old Congress N/A display logic still exists")

          index_file.write_text(h, encoding="utf-8")

          print("Integrated fixes installed successfully")

          PY

          python -m py_compile /tmp/install_fixes.py
          python /tmp/install_fixes.py
          python -m py_compile updater.py

      - name: Update fast data only
        env:
          SKIP_EARNINGS: "1"
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python updater.py

      - name: Verify generated outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          congress = Path("congress.json")
          updater = Path("updater.py")

          if not congress.exists():
              raise SystemExit("congress.json missing")

          raw = congress.read_text(encoding="utf-8").strip()
          if not raw:
              raise SystemExit("congress.json is empty")

          data = json.loads(raw)
          items = data.get("items") or []

          if not items:
              raise SystemExit("Congress fetch produced zero items")

          named = [x for x in items if str(x.get("member") or "").strip()]
          if not named:
              raise SystemExit("Congress member names are missing")

          s = updater.read_text(encoding="utf-8")

          if '_send_pushover(\n            "今日美國重要數據",' in s:
              raise SystemExit("Macro morning reminder still uses Pushover")

          if '_send_pushover(\n            "美國數據公布",' in s:
              raise SystemExit("Macro result still uses Pushover")

          print(f"Congress OK: {len(items)} trades")
          print("Macro Telegram-only check OK")
          PY

      - name: Commit generated data and integrated fixes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data.json /tmp/data.json
          cp news.json /tmp/news.json
          cp congress.json /tmp/congress.json
          cp updater.py /tmp/updater.py
          cp index.html /tmp/index.html
          cp config.json /tmp/config.json

          if [ -f focus.json ]; then cp focus.json /tmp/focus.json; fi
          if [ -f macro.json ]; then cp macro.json /tmp/macro.json; fi
          if [ -f push_state.json ]; then cp push_state.json /tmp/push_state.json; fi

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/data.json data.json
          cp /tmp/news.json news.json
          cp /tmp/congress.json congress.json
          cp /tmp/updater.py updater.py
          cp /tmp/index.html index.html
          cp /tmp/config.json config.json

          if [ -f /tmp/focus.json ]; then cp /tmp/focus.json focus.json; fi
          if [ -f /tmp/macro.json ]; then cp /tmp/macro.json macro.json; fi
          if [ -f /tmp/push_state.json ]; then cp /tmp/push_state.json push_state.json; fi

          git add data.json news.json congress.json updater.py index.html config.json
          if [ -f focus.json ]; then git add focus.json; fi
          if [ -f macro.json ]; then git add macro.json; fi
          if [ -f push_state.json ]; then git add push_state.json; fi

          if ! git diff --cached --quiet; then
            git commit -m "Fix Congress data and Telegram-only macro alerts"
            git push origin main
          fi
