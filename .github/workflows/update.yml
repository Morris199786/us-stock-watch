name: Update US Stock Watch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "updater.py"
      - "config.json"
      - "requirements.txt"
      - "index.html"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: us-stock-watch-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show trigger
        run: echo "Triggered by ${{ github.event_name }}"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update market, news, congress, and Tier 1 pushes
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: python updater.py

      - name: Commit updated data safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data.json /tmp/data.json
          cp news.json /tmp/news.json
          cp congress.json /tmp/congress.json

          if [ -f push_state.json ]; then
            cp push_state.json /tmp/push_state.json
          fi

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/data.json data.json
          cp /tmp/news.json news.json
          cp /tmp/congress.json congress.json

          if [ -f /tmp/push_state.json ]; then
            cp /tmp/push_state.json push_state.json
          fi

          git add data.json news.json congress.json

          if [ -f push_state.json ]; then
            git add push_state.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Auto update market data"
            git push origin main
          fi
