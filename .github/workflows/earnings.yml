name: Update Earnings

on:
  workflow_dispatch:
  schedule:
    # 08:30 Taiwan time
    - cron: "30 0 * * *"

    # 20:00 Taiwan time
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: us-stock-watch-update
  cancel-in-progress: false

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update latest-quarter earnings
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python updater.py

      - name: Backfill macro and send earnings reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python earnings_macro_helper.py

      - name: Commit earnings, macro and reminder state safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp earnings.json /tmp/earnings.json
          cp updater.py /tmp/updater.py
          cp config.json /tmp/config.json
          cp index.html /tmp/index.html
          cp earnings_macro_helper.py /tmp/earnings_macro_helper.py

          if [ -f macro.json ]; then
            cp macro.json /tmp/macro.json
          fi

          if [ -f congress.json ]; then
            cp congress.json /tmp/congress.json
          fi

          if [ -f push_state.json ]; then
            cp push_state.json /tmp/push_state.json
          fi

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/earnings.json earnings.json
          cp /tmp/updater.py updater.py
          cp /tmp/config.json config.json
          cp /tmp/index.html index.html
          cp /tmp/earnings_macro_helper.py earnings_macro_helper.py

          if [ -f /tmp/macro.json ]; then
            cp /tmp/macro.json macro.json
          fi

          if [ -f /tmp/congress.json ]; then
            cp /tmp/congress.json congress.json
          fi

          if [ -f /tmp/push_state.json ]; then
            cp /tmp/push_state.json push_state.json
          fi

          git add \
            earnings.json \
            updater.py \
            config.json \
            index.html \
            earnings_macro_helper.py

          if [ -f macro.json ]; then
            git add macro.json
          fi

          if [ -f congress.json ]; then
            git add congress.json
          fi

          if [ -f push_state.json ]; then
            git add push_state.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Add 08:30 earnings Telegram reminder and macro backfill"
            git push origin main
          fi
