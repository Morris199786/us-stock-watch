name: Update Earnings

on:
  workflow_dispatch:
  schedule:
    # 08:00 and 20:00 Taiwan time (UTC+8)
    - cron: "0 0,12 * * *"

permissions:
  contents: write

concurrency:
  group: us-stock-watch-update
  cancel-in-progress: false

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update latest-quarter earnings
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: python updater.py

      - name: Commit earnings and v7 parser safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp earnings.json /tmp/earnings.json
          cp updater.py /tmp/updater.py
          cp config.json /tmp/config.json
          cp index.html /tmp/index.html

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/earnings.json earnings.json
          cp /tmp/updater.py updater.py
          cp /tmp/config.json config.json
          cp /tmp/index.html index.html

          git add earnings.json updater.py config.json index.html

          if ! git diff --cached --quiet; then
            git commit -m "Install earnings parser v7 and update latest earnings"
            git push origin main
          fi
