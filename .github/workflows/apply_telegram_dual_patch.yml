name: Apply Telegram Dual Patch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-stock-watch-update
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Telegram dual-channel patch
        run: |
          python telegram_dual_patch.py

      - name: Verify patched files
        run: |
          python - <<'PY'
          from pathlib import Path

          updater = Path("updater.py").read_text(encoding="utf-8")
          helper = Path("earnings_macro_helper.py").read_text(encoding="utf-8")
          update_yml = Path(".github/workflows/update.yml").read_text(encoding="utf-8")
          earnings_yml = Path(".github/workflows/earnings.yml").read_text(encoding="utf-8")

          checks = [
              ("updater dual TG", "TELEGRAM_CHAT_ID_2" in updater),
              ("helper dual TG", "TELEGRAM_CHAT_ID_2" in helper),
              ("update.yml secret", "TELEGRAM_CHAT_ID_2" in update_yml),
              ("earnings.yml secret", "TELEGRAM_CHAT_ID_2" in earnings_yml),
          ]

          for name, ok in checks:
              print(name, "OK" if ok else "FAIL")
              if not ok:
                  raise SystemExit(name + " failed")

          idx = updater.find('"今日美國重要數據"')
          if idx >= 0:
              window = updater[idx:idx + 400]
              if "?page=macro" in window:
                  raise SystemExit("Macro morning reminder still contains URL")

          print("All patch checks OK")
          PY

      - name: Commit patched files safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            updater.py \
            earnings_macro_helper.py \
            .github/workflows/update.yml \
            .github/workflows/earnings.yml

          if ! git diff --cached --quiet; then
            git commit -m "Add dual Telegram channels and remove macro reminder URL"
            git push origin main
          else
            echo "No changes to commit"
          fi
